<section class="gallery-block pb-[100px]">
    <div class="container mx-auto px-[15px]">
        <div class="gallery-block__top-sec mb-[40px] text-center">
            <span class="up-title">{{ INFO_SEC_ITEM().upTitle }}</span>
            <h2 class="title">{{ INFO_SEC_ITEM().title }}</h2>
        </div>
        <div class="items-center">
            <div class="carousel-content px-15">
                <div class="swiper horizontal-swiper-carousel">
                    <div class="swiper-wrapper swiper-test">
                        <ng-container *ngFor="let cardElement of INFO_SEC_ITEM().cardElements">
                            <div class="swiper-slide card-content">
                                <app-card [CARD_ELEMENT]="cardElement"></app-card>
                            </div>
                        </ng-container>
                    </div>
                    <div class="swiper-h-btn-next absolute top-[35%] inline-block z-2">
                        <button class="h-btn-mini" mat-mini-fab aria-label="keyboard arrow right icon">
                            <mat-icon class="h-btn-mini__icon" aria-hidden="false" aria-label="keyboard icon" fontIcon="keyboard_arrow_left"></mat-icon>
                        </button>
                    </div>
                    <div class="swiper-h-btn-prev absolute top-[35%] right-[0] inline-block z-2 float-end">
                        <button class="h-btn-mini" mat-mini-fab aria-label="keyboard arrow left icon">
                            <mat-icon class="h-btn-mini__icon" aria-hidden="false" aria-label="keyboard icon" fontIcon="keyboard_arrow_right"></mat-icon>
                        </button>
                    </div>
                    <div class="swiper-h-pagination"></div>
                </div>
            </div>
        </div>
    </div>
</section>
