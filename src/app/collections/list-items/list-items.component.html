<mat-list class="list-container-menu">
    <ng-container *ngFor="let menuItem of MENU_ITEMS()">
        <mat-list-item class="list-container-menu__list-item !h-auto !py-2 !px-0">
            <div class="flex items-center justify-between w-full">
                <a class="text-lg" href="#">{{ menuItem.title }}</a>
                <button mat-icon-button
                    *ngIf="menuItem.subItems && menuItem.subItems.length > 0" 
                    (click)="toggleExpansion(menuItem)"
                    class="menu-toggle-btn"
                    [class.expanded]="menuItem.isExpanded">
                    <fa-icon [icon]="faPlus" size="1x"></fa-icon>
                </button>
            </div>
        </mat-list-item>
        <div class="list-container-menu__sub-menu-container" [class.isExpanded]="menuItem.isExpanded">
            <mat-list>
                <mat-list-item class="list-sub-item" *ngFor="let subItem of menuItem.subItems">
                    <a href="#">{{ subItem.title }}</a>
                </mat-list-item>
            </mat-list>
        </div>
    </ng-container>
</mat-list>
